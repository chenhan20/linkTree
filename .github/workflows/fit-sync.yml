# .github/workflows/fit-sync.yml
#
# 從 intervals.icu 抓 Garmin 原始 FIT，產出 rides/<date>.html。
#
# 這條路跟 strava-sync.yml 完全獨立，兩者不互相影響：
#   strava-sync.yml → data/strava.json（前端總覽頁）      ← 不要動
#   fit-sync.yml    → data/fit/*.fit + rides/*.html       ← 這支
#
# 為什麼能放進 Action（推翻 docs/ride-report-pipeline.md 第四節的結論）：
# intervals.icu 是 Garmin 官方核准的 partner，Garmin 走官方 webhook 主動 push 給它。
# 所以這裡沒有 Garmin 帳密、沒有 MFA、沒有 Cloudflare、不挑 IP。
# 詳見 docs/fit-pipeline.md。

name: FIT Sync (intervals.icu)

on:
  schedule:
    - cron: '30 2,14 * * *'    # 台灣時間 10:30 與 22:30，各排在 strava-sync 早班/晚班之後
                               # （strava-sync 是 10:00/18:00/22:00，錯開半小時避免同時 push master 打架，
                               #   也讓產報告時抓到的 data/strava.json 是剛更新完的）
  workflow_dispatch:
    inputs:
      backfill:
        description: '回補過去 N 天（留空 = 日常增量，只掃最近 14 天）'
        required: false
        default: ''
      min_tss:
        description: '產報告的 TSS 門檻'
        required: false
        default: '100'
      rebuild:
        description: '重生所有報告（會用現有的 notes，不會洗掉評語；同日多檔只產第一個合格者，肌力訓練不會蓋掉騎乘）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fit-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: pip install --quiet -r tools/tcx/requirements.txt

      - name: 檢查 API key
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: |
          if [ -z "$INTERVALS_API_KEY" ]; then
            echo "::error::沒有設定 INTERVALS_API_KEY。Settings → Secrets and variables → Actions 新增。"
            exit 1
          fi
          python scripts/sync-intervals.py --status

      - name: 從 intervals.icu 抓 FIT
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          FIT_DIR: data/fit
        run: |
          if [ -n "${{ inputs.backfill }}" ]; then
            python scripts/sync-intervals.py --backfill "${{ inputs.backfill }}"
          else
            python scripts/sync-intervals.py
          fi

      - name: 產生訓練報告
        env:
          FIT_DIR: data/fit
          ATHLETE_WEIGHT: ${{ vars.ATHLETE_WEIGHT || '80' }}
          ATHLETE_HEIGHT: ${{ vars.ATHLETE_HEIGHT || '173' }}
        run: |
          ARGS="--min-tss ${{ inputs.min_tss || '100' }}"
          [ "${{ inputs.rebuild }}" = "true" ] && ARGS="$ARGS --overwrite"
          python scripts/build-ride-reports.py $ARGS

      # always()：產報告那步就算非零退出也要存檔。單一壞掉的 FIT 不該讓當班
      # 抓到的檔案與已產出的報告全部丟掉（runner 是拋棄式的，沒存就沒了）。
      #
      # 這一步的順序是刻意的，為了避開跟 strava-sync 搶 data/itt-segments.json：
      #   1. 先 commit「只有 fit-sync 會動」的東西（data/fit、rides）
      #   2. 再 pull --rebase 吃掉 strava-sync 可能剛推的 itt-segments.json
      #      —— 我方這個 commit 完全沒碰那個檔，所以 rebase 不可能衝突
      #   3. 最後才在「最新版的 itt-segments.json」上跑回補，另開一個 commit
      # 反過來（先回補再 pull）就會兩邊都改同一個 JSON，rebase 撞在一起整班報銷。
      - name: 存檔
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data/fit rides
          git add data/fit rides
          if git diff --staged --quiet; then
            echo "沒有 FIT／報告變更。"
          else
            git commit -m "chore: fit sync $(date -u '+%Y-%m-%d')"
          fi
          # 排程實際延遲 13~56 分，跟 strava-sync 的錯開設計會失效而撞車。
          git pull --rebase || echo "::warning::rebase 失敗，改用當前 itt-segments.json 回補"
          # 自建偵測器算 ITT 計時：不需要 Strava 訂閱，跟官方 91 筆逐筆吻合（平均差 0.75s）。
          # 純本機運算、不打任何 API；FIT 端的成績是整批重算，改演算法就會自動修正歷史。
          python scripts/backfill-itt-efforts.py --quiet || \
            echo "::warning::ITT 回補失敗，這班先跳過"
          # 補來源標記，並把成績併回 data/strava.json 的 segments 副本。
          # 沒有這步的話兩份檔案會漂移：itt-segments.json 有 10 筆、strava.json 只有 1 筆，
          # 而 strava-sync（已棄用、隨時可能停跑）是唯一會把它們對齊的東西。實測撞過。
          python scripts/tag-itt-sources.py || \
            echo "::warning::ITT 來源標記失敗，這班先跳過"
          # 室內騎乘的等效平路里程估算（訓練台沒有速度感測，distance 是 0）。
          # 純本機運算、只算還沒算過的趟，要排在教練脈絡之前 —— 月里程要用它。
          python scripts/estimate-indoor-distance.py || \
            echo "::warning::室內里程估算失敗，這班先跳過"
          # 給外部 AI 教練讀的單一檔案。純本機運算、不打 API、不到一秒。
          # 一定要排在這裡（ITT 回補之後、commit 之前）：它會讀 training-block.json
          # 的 actual 與 data/fit/_scores 的逐段對帳，兩者都是這一班剛更新完的。
          # 沒有這步的話它會停在最後一次手動重跑那天 —— 貼給 GPT 的就是過期的身體狀態。
          python scripts/build-coach-context.py || \
            echo "::warning::教練脈絡重建失敗，這班先跳過"
          git add data/itt-segments.json data/strava.json athlete/coach-context.md data/fit/_est_distance.json
          git diff --staged --quiet || \
            git commit -m "chore: 回補自建 ITT 成績 $(date -u '+%Y-%m-%d')"
          git push || (git pull --rebase && git push)
