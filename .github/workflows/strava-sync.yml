# .github/workflows/strava-sync.yml
#
# ⛔ 已停用（2026-10-12）。排程已拿掉，只剩 workflow_dispatch 讓檔案留著當紀錄。
#
# 為什麼：Strava 把這個 App 停用了。最後一次成功是 2026-10-11 22:10（台灣），
# 2026-10-12 10:36 起 activities API 回
#   {"message":"Forbidden","errors":[{"resource":"Application","field":"Status","code":"Inactive"}]}
# token 換得到、stats 還通，只有 activities 被擋＝App 層級停用，重試沒有用。
#
# 現在誰在更新資料：fit-sync.yml（Garmin → intervals.icu → FIT）。
#   - data/strava.json 的 segments（ITT 成績）仍由 fit-sync 的 tag-itt-sources.py 併 FIT 更新
#   - 其餘欄位（recent_rides／summary／monthly_*／weekly_quest／power_prs…）凍結在 2026-10-11
#
# 復活：訂閱／App 恢復後，把下面 schedule 的三行 cron 補回來即可（原本台灣 10:00／18:00／22:00，
# UTC 02:00／10:00／14:00），repo Secrets 的 STRAVA_* 四個還留著。
# 程式碼（scripts/fetch-strava.js、harvest-strava.js、scan-power-prs.js…）全部保留。

name: Strava Daily Sync

on:
  # schedule 已拿掉（2026-10-12，見檔頭）。復活時補回：
  #   - cron: '0 2 * * *'    # 台灣早上 10:00
  #   - cron: '0 10 * * *'   # 台灣下午 18:00
  #   - cron: '0 14 * * *'   # 台灣晚上 22:00

  workflow_dispatch:        # 手動觸發（目前會失敗：Application Inactive）
    inputs:
      fetch_all:
        description: '全量抓取所有歷史活動並重建 monthly_history（第一次設定用）'
        type: boolean
        default: false
      scan_power:
        description: '重掃 Power PR（會自動改用全量活動，避免只掃最近 100 筆）'
        type: boolean
        default: false
      power_only:
        description: '只做功率 PR 更新，跳過 laps/segments enrichment（建議重掃功率時開啟）'
        type: boolean
        default: true
      scan_segments:
        description: '新增 ITT 路段後用這個：對全史騎乘重掃 segment efforts（會自動改用全量並關掉 power_only）'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. 把 repo clone 下來
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. 裝 Node.js（fetch-strava.js 用的是內建 https 模組，不需要 npm install）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 3. 執行 script，把 GitHub Secrets 注入成環境變數
      - name: Run Strava fetch script
        env:
          STRAVA_CLIENT_ID:     ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_ATHLETE_ID:    ${{ secrets.STRAVA_ATHLETE_ID }}
          # scan_segments 也要吃全量活動，不然只掃最近 100 筆，舊的 effort 補不齊
          FETCH_ALL:            ${{ (inputs.fetch_all == true || inputs.scan_power == true || inputs.scan_segments == true) && '1' || '0' }}
          SCAN_POWER:           ${{ inputs.scan_power == true && '1' || '0' }}
          # scan_segments 時強制關掉 power_only（它預設是 true，開著會跳過
          # segments enrichment，等於白按一次全量掃描）
          POWER_ONLY:           ${{ (inputs.power_only == true && inputs.scan_segments != true) && '1' || '0' }}
          SCAN_SEGMENTS:        ${{ inputs.scan_segments == true && '1' || '0' }}
        run: node scripts/fetch-strava.js

      # 4. 補齊 ITT 路段的地形高程（只抓還沒有資料的路段；山不會動，抓過就不再抓）
      #    來源：Tilezen / AWS Open Data terrain tiles，無需金鑰
      - name: Fetch segment terrain (new segments only)
        continue-on-error: true
        run: node scripts/fetch-segment-terrain.js

      # 5. 如果資料檔有變動，commit 並 push 回 repo
      - name: Commit and push data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # itt-segments.json 也是 fetch-strava.js 每次產出的，但一直不在這串裡，
          # 所以 CI 從來沒 commit 過它（只有人工 commit）。build-ride-reports.py
          # 的 ITT 門檻豁免就是讀它，漏掉會讓新的 ITT 成績進不了報告判斷。
          git add data/strava.json data/power-prs.json data/segment-terrain.json data/itt-segments.json
          # 如果沒有變動就不 commit（避免空 commit）
          git diff --staged --quiet || git commit -m "chore: update strava data $(date -u '+%Y-%m-%d')"
          git push || (git pull --rebase && git push)
