<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>變強，變壯 · 重量訓練指南 · Steve Chuang</title>
<meta name="description" content="給中階訓練者的重量訓練全方位簡報：變強與變壯的原理、課表怎麼排、健美式孤立訓練的肌群地圖、功能性怎麼結合、飲食、營養品、睡眠與恢復、追蹤與停滯。每個動作附 YouTube 搜尋關鍵字。">
<meta name="theme-color" content="#15171a">
<link rel="icon" href="assets/lifting/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --num:'Oswald','Arial Narrow','Noto Sans TC',sans-serif;
  --bg:#15171a;--bg2:#1d2024;--bg3:#262a2f;
  --fg:#ece6d8;--fg2:#b7bcc2;--fg3:#7f868e;--line:rgba(236,230,216,.16);--line2:rgba(236,230,216,.08);
  --red:#e0392f;--red2:#ff6a5c;--chalk:#ece6d8;
  --gut:clamp(20px,5vw,84px);--top:88px;--bot:92px;
  --settle:cubic-bezier(.2,.7,.2,1);
}
html,body{height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--sans);color:var(--fg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;line-height:1.6}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--red2);outline-offset:3px}

/* ── 地板：橡膠地墊的點紋＋角落的光 ─────────────────────── */
.floor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 110%,#262a2f 0%,#1a1d21 45%,var(--bg) 100%)}
.floor::before{content:'';position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(rgba(236,230,216,.075) .8px,transparent 1.1px);background-size:14px 14px}
.floor::after{content:'';position:absolute;left:-20vw;top:-30vh;width:70vw;height:70vh;border-radius:50%;
  background:radial-gradient(closest-side,rgba(236,230,216,.045),transparent 70%)}

/* ── 頂欄：回首頁、名字、槓鈴（章節導覽）、工具 ──────────── */
.top{position:fixed;left:0;right:0;top:0;z-index:20;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;
  gap:clamp(12px,2vw,28px);padding:16px var(--gut) 0;pointer-events:none;color:var(--fg)}
.top>*{pointer-events:auto}
.home{display:inline-flex;align-items:center;gap:6px;font-size:13px;letter-spacing:.06em;text-decoration:none;opacity:.78;white-space:nowrap}
.home:hover{opacity:1}
.home svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand img{width:26px;height:26px}
.brand b{font:600 14px/1 var(--num);letter-spacing:.2em;text-transform:uppercase}
.brand span{font:900 15px/1 var(--sans);letter-spacing:.14em;color:var(--fg2)}
.chbar{position:relative;height:56px;min-width:0}
.chbar svg{position:absolute;left:0;top:0;width:100%;height:36px;overflow:visible;display:block}
.chbar svg .rod{stroke:rgba(236,230,216,.3);stroke-width:3;stroke-linecap:round}
.chbar svg .rodon{stroke:var(--chalk);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .8s var(--settle)}
.chbar svg .plate{fill:rgba(236,230,216,.14);stroke:rgba(236,230,216,.3);stroke-width:1;cursor:pointer;transition:fill .3s,stroke .3s}
.chbar svg .plate.done{fill:rgba(236,230,216,.55);stroke:rgba(236,230,216,.7)}
.chbar svg .plate.on{fill:var(--red);stroke:var(--red2)}
.chbar svg .plate:hover{stroke:var(--chalk)}
.chbar svg text{font:500 10px var(--num);fill:var(--fg3);letter-spacing:.08em;pointer-events:none}
.chbar svg text.on{fill:var(--fg)}
.chbar .cur{position:absolute;left:0;right:0;bottom:0;font:500 11px/1.2 var(--num);letter-spacing:.1em;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chbar .cur b{color:var(--fg);font-weight:700;margin-right:8px;font-family:var(--sans);font-size:11.5px;letter-spacing:.06em}
.tools{display:flex;align-items:center;gap:8px}
.count{margin-right:4px;font:500 15px var(--num);letter-spacing:.1em;opacity:.75}
.tbtn{display:grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid var(--line);border-radius:50%;background:transparent;cursor:pointer;transition:border-color .2s,background .3s}
.tbtn:hover{border-color:currentColor}
.tbtn[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.tbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn .i-pause,#auto[aria-pressed=true] .i-play{display:none}
#auto[aria-pressed=true] .i-pause{display:block}

/* ── 投影片 ───────────────────────────────────────── */
.deck{position:fixed;inset:0;z-index:3;touch-action:pan-y}
.slide{position:absolute;inset:0;padding:var(--top) var(--gut) var(--bot);display:grid;color:var(--fg);align-content:start;row-gap:clamp(12px,2.2vh,22px);
  opacity:0;visibility:hidden;overflow:hidden auto;scrollbar-width:none;overscroll-behavior:contain;
  transition:opacity .3s ease,visibility 0s .3s}
.slide::-webkit-scrollbar{display:none}
.slide.is-on{opacity:1;visibility:visible;transition:opacity .5s ease .25s,visibility 0s}
.eyebrow{font:500 13px/1.3 var(--num);letter-spacing:.2em;color:var(--red2);text-transform:uppercase}
.eyebrow em{font-style:normal;color:var(--fg3);margin-left:10px;letter-spacing:.14em}
.slide h2{margin-top:8px;font:900 clamp(26px,3.4vw,50px)/1.22 var(--sans);letter-spacing:.01em;text-wrap:balance}
.lede{margin-top:clamp(8px,1.6vh,16px);font-size:clamp(14.5px,1.15vw,17px);line-height:1.85;color:var(--fg2);max-width:34em;text-wrap:pretty}
.lede b,.body b{color:var(--fg);font-weight:700}
.head{min-width:0}
.body{min-width:0;display:grid;gap:clamp(12px,2vh,20px);align-content:start}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:clamp(24px,4vw,64px)}
.two>.body{align-self:start}
.wide{grid-template-columns:minmax(0,1fr)}
.wm{position:absolute;right:var(--gut);bottom:calc(var(--bot) - 36px);font:600 clamp(110px,20vw,300px)/1 var(--num);letter-spacing:-.02em;color:rgba(236,230,216,.04);pointer-events:none;user-select:none;overflow:hidden}

/* 進場 */
.rv{opacity:0}
.slide.is-on .rv{animation:rvin .5s ease both;animation-delay:calc(var(--k,0)*50ms + .45s)}
@keyframes rvin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 文字元件：一條線＋留白，不做卡片 */
.pts{list-style:none;max-width:44em}
.pts li{display:grid;grid-template-columns:minmax(6.5em,auto) minmax(0,1fr);gap:2px 16px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.pts li:last-child{border-bottom:1px solid var(--line)}
.pts .k{font-weight:700;font-size:14px;letter-spacing:.02em}
.pts .k small{display:block;margin-top:2px;font:500 12px/1.4 var(--num);letter-spacing:.08em;color:var(--fg3)}
.pts p{font-size:13.5px;line-height:1.72;color:var(--fg2);text-wrap:pretty}
.pts li.hot .k{color:var(--red2)}
.steps{list-style:none;counter-reset:s;max-width:44em}
.steps li{position:relative;padding:8px 0 8px 2.4em;border-top:1px solid var(--line);font-size:13.5px;line-height:1.72;color:var(--fg2)}
.steps li:last-child{border-bottom:1px solid var(--line)}
.steps li::before{counter-increment:s;content:counter(s,decimal-leading-zero);position:absolute;left:0;top:10px;font:600 14px var(--num);letter-spacing:.06em;color:var(--red2)}
.steps li b{color:var(--fg)}
.quote{padding:10px 0 10px 16px;border-left:2px solid var(--red);font-size:14px;line-height:1.75;color:var(--fg2);max-width:40em}
.quote b{color:var(--fg)}
.note{font-size:12.5px;line-height:1.7;color:var(--fg3);max-width:60em;text-wrap:pretty}
.note a{color:var(--fg2)}
.chips{display:flex;flex-wrap:wrap;gap:6px 8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--fg2);text-decoration:none;white-space:nowrap;transition:border-color .2s,color .2s}
.chip:hover{border-color:var(--chalk);color:var(--fg)}
.chip i{font-style:normal;font:500 11px var(--num);letter-spacing:.08em;color:var(--red2)}

/* 表格 */
.tw{overflow-x:auto;scrollbar-width:thin;max-width:100%;touch-action:pan-x pan-y}
table.t{border-collapse:collapse;width:100%;font-size:13px;line-height:1.55}
table.t th{text-align:left;font:500 11.5px var(--num);letter-spacing:.12em;color:var(--fg3);padding:6px 10px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase}
table.t td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line2);vertical-align:top;color:var(--fg2)}
table.t td:first-child{color:var(--fg);font-weight:700;white-space:nowrap}
table.t tr.hot td{color:var(--fg)}
table.t tr.hot td:first-child{color:var(--red2)}
table.t td.n,table.t th.n{font-family:var(--num);font-weight:500;letter-spacing:.04em;white-space:nowrap;font-size:14px}
table.t .yt{display:inline-block;margin-left:6px;font:500 10.5px var(--num);letter-spacing:.1em;color:var(--red2);text-decoration:none;border-bottom:1px dotted rgba(255,106,92,.5)}
table.t .yt:hover{border-bottom-style:solid}
table.t .bad{display:block;margin-top:2px;font-size:12px;color:var(--fg3)}
table.t.dense td,table.t.dense th{padding-top:5px;padding-bottom:5px;font-size:12.5px}
.tier{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2.4vw,32px)}
.tier>div{min-width:0}
.tier-4{grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.6vw,24px)}
.tier-5{grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(10px,1.2vw,18px)}
table.t.prog td:first-child{white-space:normal}
table.t.prog td,table.t.prog th{padding-right:6px;font-size:12px}
.tier-5 table.t.prog td,.tier-5 table.t.prog th{font-size:11.5px}
.tier-5 table.t.prog td.n{font-size:12.5px}
.tier h3{font:600 12px var(--num);letter-spacing:.18em;color:var(--fg3);text-transform:uppercase;padding-bottom:6px;border-bottom:1px solid var(--line)}
.tier h3 b{display:block;margin-top:3px;font:700 15px var(--sans);letter-spacing:.04em;color:var(--fg)}
.tier.hot1>div:first-child h3 b{color:var(--red2)}
.tier ul{list-style:none}
.tier li{padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px;line-height:1.6;color:var(--fg2)}
.tier li b{color:var(--fg);font-weight:700}
.tier li small{display:block;font:500 12px var(--num);letter-spacing:.06em;color:var(--fg3);margin-top:1px}

/* 圖表 */
.fig{width:100%;min-width:0}
.fig svg{width:100%;height:auto;display:block;overflow:visible}
.fig text{font-family:var(--sans);fill:var(--fg2);font-size:12px}
.fig .n{font-family:var(--num);font-weight:500;letter-spacing:.04em}
.fig .ax{stroke:var(--line);stroke-width:1}
.fig .ax2{stroke:var(--line2);stroke-width:1;stroke-dasharray:2 4}
.fig .ln{fill:none;stroke:var(--chalk);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fig .ln.red{stroke:var(--red2)}
.fig .ln.dim{stroke:rgba(236,230,216,.35);stroke-dasharray:3 5}
.fig .area{fill:rgba(224,57,47,.16)}
.fig .bar{fill:rgba(236,230,216,.55)}
.fig .bar.red{fill:var(--red)}
.fig .bar.dim{fill:rgba(236,230,216,.2)}
.fig .lb{fill:var(--fg3);font-size:11.5px}
.fig .lb2{fill:var(--fg);font-size:13px;font-weight:700}
.fig .dot{fill:var(--red);stroke:var(--bg);stroke-width:2}
.cap{font-size:12px;line-height:1.6;color:var(--fg3);margin-top:6px;text-wrap:pretty}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
.slide.is-on .draw{animation:draw 1.3s ease-out .6s both}
@keyframes draw{to{stroke-dashoffset:0}}
.grow{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0)}
.slide.is-on .grow{animation:grow .7s var(--settle) both;animation-delay:calc(var(--k,0)*40ms + .5s)}
@keyframes grow{to{transform:none}}

/* 互動控制 */
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.ctl label{font-size:13px;color:var(--fg2);display:inline-flex;align-items:center;gap:8px}
.ctl input[type=range]{width:clamp(120px,16vw,220px);accent-color:var(--red)}
.ctl input[type=number]{width:5.2em;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg3);color:var(--fg);font:500 15px var(--num);letter-spacing:.04em}
.ctl output,.ctl .v{font:600 16px var(--num);letter-spacing:.04em;color:var(--fg);min-width:3.2em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{padding:6px 14px;border:0;background:transparent;color:var(--fg2);font-size:13px;letter-spacing:.04em;cursor:pointer;transition:background .2s,color .2s}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--chalk);color:var(--bg);font-weight:700}
.seg button:hover:not([aria-pressed=true]){color:var(--fg)}
.big{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline}
.big div{display:flex;flex-direction:column;gap:2px}
.big b{font:600 clamp(28px,2.8vw,40px)/1 var(--num);letter-spacing:.01em;color:var(--fg)}
.big b.red{color:var(--red2)}
.big b small{font-size:.5em;color:var(--fg3);margin-left:4px;letter-spacing:.06em}
.big span{font-size:12px;letter-spacing:.08em;color:var(--fg3)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--fg);text-decoration:none;font-size:13.5px;letter-spacing:.06em;cursor:pointer;transition:border-color .2s,background .2s}
.btn:hover{border-color:currentColor}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.pri:hover{background:var(--red2)}
.btn:disabled{opacity:.35;cursor:default}

/* 週曆（分化規劃） */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week>div{min-height:88px;padding:8px 8px 10px;border:1px solid var(--line2);border-radius:4px;background:rgba(236,230,216,.03)}
.week>div.on{border-color:var(--line);background:rgba(236,230,216,.06)}
.week .d{font:500 11px var(--num);letter-spacing:.14em;color:var(--fg3)}
.week .s{margin-top:6px;font-weight:700;font-size:13.5px;letter-spacing:.02em}
.week .s.rest{color:var(--fg3);font-weight:400}
.week .m{margin-top:4px;font-size:11.5px;line-height:1.5;color:var(--fg2)}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px 14px}
.sets div{display:flex;flex-direction:column;gap:3px;padding:6px 0;border-top:1px solid var(--line2)}
.sets span{font-size:12px;color:var(--fg3);letter-spacing:.04em}
.sets b{font:600 18px/1 var(--num);letter-spacing:.02em}
.sets i{display:block;height:4px;border-radius:2px;background:rgba(236,230,216,.12);overflow:hidden}
.sets i::after{content:'';display:block;height:100%;width:var(--p);background:var(--chalk)}
.sets div.lo b{color:var(--fg3)}.sets div.ok b{color:var(--fg)}.sets div.hi b{color:var(--red2)}
.sets div.hi i::after{background:var(--red)}

/* 肌群地圖 */
.map{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(18px,3vw,48px);align-items:start}
.bodies{display:flex;justify-content:center;gap:clamp(10px,2vw,28px)}
.bodies figure{flex:1 1 0;max-width:205px;min-width:0;text-align:center}
.bodies figcaption{font:500 11px var(--num);letter-spacing:.2em;color:var(--fg3);margin-top:6px}
.bodies svg{width:100%;height:auto;display:block;overflow:visible}
.bodies .skin{fill:rgba(236,230,216,.06);stroke:rgba(236,230,216,.16);stroke-width:.8}
.bodies [data-m]{fill:rgba(236,230,216,.14);stroke:rgba(236,230,216,.34);stroke-width:.8;cursor:pointer;transition:fill .25s,stroke .25s}
.bodies [data-m]:hover{fill:rgba(236,230,216,.34);stroke:var(--chalk)}
.bodies [data-m].on{fill:var(--red);stroke:var(--red2)}
.mpanel{min-width:0}
.mpanel h3{font:900 clamp(22px,2.2vw,30px)/1.2 var(--sans);letter-spacing:.02em}
.mpanel h3 small{display:block;margin-top:4px;font:500 12px var(--num);letter-spacing:.2em;color:var(--fg3)}
.mpanel .fn{margin-top:8px;font-size:13.5px;line-height:1.75;color:var(--fg2)}
.mpanel .land{margin-top:10px}
.mlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mlist button{padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--fg2);font-size:12.5px;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.mlist button:hover{color:var(--fg);border-color:var(--chalk)}
.mlist button[aria-pressed=true]{background:var(--chalk);color:var(--bg);border-color:var(--chalk);font-weight:700}
.land{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:420px}
.land div{padding:6px 0;border-top:1px solid var(--line)}
.land span{font-size:11.5px;letter-spacing:.08em;color:var(--fg3)}
.land b{display:block;font:600 20px/1.1 var(--num);letter-spacing:.02em}

/* 槓片計算（1RM） */
.barbell{width:100%;max-width:560px}
.barbell svg{width:100%;height:auto;display:block;overflow:visible}
.plates{display:flex;flex-wrap:wrap;gap:8px 12px;font:500 12px var(--num);letter-spacing:.08em;color:var(--fg3)}
.plates i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* 封面與結尾 */
.s-cover{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;align-content:center;column-gap:clamp(20px,4vw,70px)}
.s-cover h1{margin-top:14px;font:900 clamp(56px,min(8.6vw,15dvh),130px)/1.05 var(--sans);letter-spacing:.02em}
.s-cover h1 span{display:block}
.s-cover .sub{margin-top:clamp(12px,2.4vh,26px);font-size:clamp(15px,1.3vw,19px);line-height:1.8;color:var(--fg2);text-wrap:pretty;max-width:30em}
.s-cover .sub b{font:600 1.2em/1 var(--num);color:var(--red2);letter-spacing:.02em}
.hint{margin-top:clamp(14px,3vh,30px);font-size:13px;letter-spacing:.08em;color:var(--fg3)}
.hint-kbd{display:none}
@media (hover:hover) and (pointer:fine){.hint-kbd{display:inline}.hint-touch{display:none}}
.cover-art{display:flex;justify-content:center;align-items:center}
.cover-art svg{width:min(42vmin,440px);height:auto;display:block;overflow:visible;filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))}
.toc{list-style:none;columns:2;column-gap:clamp(24px,4vw,64px);max-width:980px}
.toc li{break-inside:avoid}
.toc button{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:12px;align-items:baseline;width:100%;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;color:var(--fg);text-align:left;cursor:pointer}
.toc li:last-child button{border-bottom:1px solid var(--line)}
.toc .n{font:600 15px var(--num);letter-spacing:.08em;color:var(--red2)}
.toc .t{font-weight:700;font-size:15px;letter-spacing:.02em;transition:color .2s}
.toc .t small{display:block;font-weight:400;font-size:12px;color:var(--fg3);margin-top:2px;letter-spacing:.02em}
.toc .c{font:500 12px var(--num);letter-spacing:.1em;color:var(--fg3);white-space:nowrap}
.toc button:hover .t{color:var(--red2)}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.asof{font-size:11.5px;letter-spacing:.06em;color:var(--fg3)}

/* ── 底部換頁 ───────────────────────────────────── */
.pager{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;align-items:center;gap:clamp(8px,2vw,22px);
  padding:0 var(--gut) calc(22px + env(safe-area-inset-bottom));pointer-events:none;color:var(--fg)}
.pager>*{pointer-events:auto}
.arw{display:grid;place-items:center;width:42px;height:42px;padding:0;border:1px solid var(--line);border-radius:50%;background:rgba(21,23,26,.6);color:inherit;cursor:pointer;transition:border-color .2s,opacity .2s}
.arw:hover{border-color:currentColor}
.arw:disabled{opacity:.25;cursor:default}
.arw svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pg{display:flex;align-items:center;gap:2px}
.pg button{width:16px;height:26px;padding:0;border:0;background:none;cursor:pointer;color:inherit;display:grid;place-items:center}
.pg button i{display:block;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.32;transition:opacity .3s,transform .35s var(--settle),background .3s}
.pg button.ch i{width:6px;height:6px;opacity:.55}
.pg button:hover i{opacity:.85}
.pg button[aria-current=true] i{opacity:1;transform:scale(1.6);background:var(--red2)}
.live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── 窄螢幕 ─────────────────────────────────────── */
@media (max-aspect-ratio:1/1),(max-width:820px){
  :root{--top:96px;--bot:84px}
  .top{grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding-top:12px}
  .brand{display:none}
  .home span{display:none}
  .chbar{height:60px}
  .chbar .cur{font-size:10.5px}
  .count{display:none}
  .tbtn{width:36px;height:36px}
  .slide{padding-top:calc(var(--top) + 4px)}
  .two,.s-cover,.map{grid-template-columns:minmax(0,1fr)}
  .s-cover{align-content:start;justify-items:center;text-align:center}
  .s-cover h1{font-size:clamp(44px,13vw,80px)}
  .s-cover .sub{max-width:none}
  .cover-art{order:-1;padding-top:4px}
  .cover-art svg{width:min(56vw,260px)}
  .slide h2{font-size:clamp(24px,6.4vw,34px)}
  .lede{font-size:14.5px;line-height:1.75;max-width:none}
  .wm{display:none}
  .pts li{grid-template-columns:minmax(0,1fr);gap:3px 0}
  .pts .k small{display:inline;margin-left:8px}
  .tier,.tier-4,.tier-5{grid-template-columns:minmax(0,1fr)}
  .toc{columns:1}
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
  .week>div{min-height:0}
  .bodies figure{max-width:170px}
  .land{max-width:none}
  .arw{width:38px;height:38px}
  .pg{display:none}
  .pager .count{display:block;margin:0 6px}
  .pager::before{content:'';position:absolute;left:0;right:0;bottom:0;height:120px;z-index:-1;pointer-events:none;background:linear-gradient(to top,var(--bg2) 30%,transparent)}
}
@media (max-height:720px) and (min-aspect-ratio:1/1){
  :root{--top:78px;--bot:74px}
  .lede{font-size:14px;line-height:1.7}
  .pts li{padding:6px 0}.pts p{font-size:13px;line-height:1.6}
  table.t td{padding-top:5px;padding-bottom:5px}
}
@media (prefers-reduced-motion:reduce){
  .slide.is-on .rv,.slide.is-on .draw,.slide.is-on .grow{animation:none;opacity:1;stroke-dashoffset:0;transform:none}
  .chbar svg .rodon{transition:none}
}

<script>
(() => {
'use strict'
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)]
const NS = 'http://www.w3.org/2000/svg'
const S = (tag, attrs = {}, ...kids) => { const e = document.createElementNS(NS, tag); for (const k in attrs) { const v = attrs[k]; if (v == null) continue; if (k === 'style') e.style.cssText += ';' + v; else e.setAttribute(k, v) } kids.forEach(c => c != null && e.append(c)); return e }
const root = document.documentElement
const NARROW = matchMedia('(max-aspect-ratio: 1/1), (max-width: 820px)')
const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const r1 = n => Math.round(n * 10) / 10
/* YouTube 一律用搜尋網址，不寫死影片 ID（影片會下架，關鍵字不會） */
const ytUrl = kw => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(kw)
const yt = kw => `<a class="yt" href="${ytUrl(kw)}" target="_blank" rel="noopener" title="YouTube 搜尋：${esc(kw)}">YT</a>`
/* 表格：rows 裡的字串原樣輸出（可含 yt()），hot 列用 {hot:true, c:[...]} */
const tbl = (heads, rows, cls = '') => `<div class="tw"><table class="t ${cls}"><thead><tr>${heads.map(h => `<th${/^#/.test(h) ? ' class="n"' : ''}>${h.replace(/^#/, '')}</th>`).join('')}</tr></thead><tbody>${rows.map(r => { const hot = r.hot, c = r.c || r; return `<tr${hot ? ' class="hot"' : ''}>${c.map((x, i) => `<td${/^#/.test(heads[i] || '') ? ' class="n"' : ''}>${x}</td>`).join('')}</tr>` }).join('')}</tbody></table></div>`
/* 動作：中文名＋英文關鍵字（連到 YouTube 搜尋）＋「你會做錯的地方」 */
const ex = (zh, kw, bad) => `${esc(zh)}${yt(kw)}${bad ? `<span class="bad">${esc(bad)}</span>` : ''}`
const pts = items => `<ul class="pts">${items.map((it, i) => `<li class="rv${it.hot ? ' hot' : ''}" style="--k:${i + 1}"><span class="k">${esc(it.k)}${it.s ? `<small>${esc(it.s)}</small>` : ''}</span><p>${it.p}</p></li>`).join('')}</ul>`
const steps = items => `<ol class="steps">${items.map((p, i) => `<li class="rv" style="--k:${i + 1}">${p}</li>`).join('')}</ol>`

/* ═══ 內容：一章一個物件，一張一個物件。html 是投影片主體；需要互動的張用 mount 掛上去 ═══ */
const MOUNT = {}
const DECK = []
const head = (eyebrow, h2, lede) => `<div class="head"><p class="eyebrow">${eyebrow}</p><h2>${h2}</h2>${lede ? `<p class="lede">${lede}</p>` : ''}</div>`

/* ── 第 1 章 兩件事 ── */
DECK.push({ n: 1, title: '兩件事', en: 'STRONG VS BIG', sub: '變強與變壯不是同一條路', slides: [
  { key: 'toc', title: '目錄', type: 'toc' },
  { key: 'two-things', title: '變強跟變壯是兩件事', cls: 'two', html: head('第 1 章 <em>兩件事</em>', '變強跟變壯是兩件事', '力量是神經系統、技術加肌肉量的總和；肥大只看肌肉的橫截面積。兩條路重疊很大，但處方的重點不同，先把這張表看懂，後面每一章都在套它。') +
    `<div class="body">${tbl(['', '變強（力量）', '變壯（肥大）'], [
      ['主要適應', '神經徵召、動作技術、肌腱剛性，肌肉量是基礎', '肌纖維變粗（橫截面積），主要靠機械張力'],
      ['#強度', '≥ 80% 1RM 為主', '30–85% 1RM 都會長，重點是接近力竭'],
      ['#次數', '1–5 下', '6–30 下，6–12 最省時間'],
      ['保留次數 RIR', '2–4，技術不能走樣', '0–3，最後幾下要慢下來'],
      ['#組間休息', '3–5 分鐘', '複合 2–3 分、孤立 60–90 秒'],
      ['動作', '少數幾個大動作反覆練，練的是技術', '複合打底，孤立補每一塊肌肉'],
      ['進步的尺', '1RM 或 3–5RM 的重量', '相同重量做更多下、圍度、照片'],
      ['看到結果', '第一週就會（神經）', '8–12 週才看得見'],
    ])}<p class="note">中階的做法通常是兩者合一：每堂課開頭用 1 個大動作練力量（3–5 下、RIR 2–3），後面全部用肥大的處方。這一套簡報就是照這個順序排的。</p></div>` },
  { key: 'timeline', title: '適應的時間軸', cls: 'two', html: head('第 1 章 <em>兩件事</em>', '前八週漲的是力量，不是肌肉', '剛開始練或換新動作時，重量漲很快，那是神經系統學會用力，不是肌肉長了。肥大要連續 8 到 12 週才看得見，而且年資越深越慢。知道這個，才不會在第四週換課表。') +
    `<div class="body"><div class="fig" id="f-timeline"></div>${tbl(['訓練年資', '#每月可增肌（男）', '#每月可增肌（女）', '一年大約'], [
      ['新手（0–1 年）', '0.7–1.0 kg', '0.35–0.5 kg', '男 8–12 kg'],
      { hot: true, c: ['中階（1–3 年）', '0.35–0.5 kg', '0.2–0.25 kg', '男 4–6 kg'] },
      ['高階（3 年以上）', '0.2–0.25 kg', '0.1–0.15 kg', '男 2–3 kg'],
    ], 'dense')}<p class="note">增肌速率是常見的經驗模型（Aragon、McDonald 兩套大致相符），個體差異很大，拿來設定期待值就好。中階一個月 0.35 到 0.5 公斤的肌肉，體重計上幾乎看不出來，所以要用圍度跟照片追蹤。</p></div>` },
] })
MOUNT['timeline'] = sec => {
  const W = 640, H = 230, g = S('svg', { viewBox: `0 0 ${W} ${H}` })
  const x = w => 40 + (w / 24) * (W - 70), y0 = H - 36
  g.append(S('line', { class: 'ax', x1: 40, y1: y0, x2: W - 20, y2: y0 }))
  ;[0, 4, 8, 12, 16, 20, 24].forEach(w => { g.append(S('line', { class: 'ax', x1: x(w), y1: y0, x2: x(w), y2: y0 + 5 })); g.append(S('text', { class: 'lb n', x: x(w), y: y0 + 19, 'text-anchor': 'middle' }, w === 0 ? '第 0 週' : `${w}`)) })
  const pts = (f, n = 48) => Array.from({ length: n + 1 }, (_, i) => { const w = 24 * i / n; return `${x(w).toFixed(1)},${(y0 - f(w) * (y0 - 40)).toFixed(1)}` }).join(' ')
  // 神經：快速上升後趨平；肌肉：慢慢往上，8 週後才明顯
  g.append(S('polyline', { class: 'ln dim', points: pts(w => 1 - Math.exp(-w / 3.2)) }))
  g.append(S('polyline', { class: 'ln red draw', pathLength: 1, points: pts(w => Math.pow(w / 24, 1.35)) }))
  g.append(S('text', { class: 'lb', x: x(6), y: 52 }, '神經適應（力量）'))
  g.append(S('text', { class: 'lb2', x: x(16), y: y0 - 0.33 * (y0 - 40) - 10, style: 'fill:var(--red2)' }, '肌肉量（肥大）'))
  g.append(S('line', { class: 'ax2', x1: x(8), y1: 40, x2: x(8), y2: y0 }))
  g.append(S('text', { class: 'lb', x: x(8) + 6, y: 48 }, '8 週：肥大開始看得見'))
  $('#f-timeline', sec).append(g)
}

/* ── 第 2 章 肌肉怎麼長 ── */
DECK.push({ n: 2, title: '肌肉怎麼長', en: 'HOW MUSCLE GROWS', sub: '張力、接近力竭、組數、頻率、超負荷', slides: [
  { key: 'drivers', title: '三個驅動力', cls: 'two', html: head('第 2 章 <em>肌肉怎麼長</em>', '長肌肉只有一個主因：機械張力', '肌肉長大的訊號來自肌纖維被高張力拉著做功。代謝壓力（泵感、灼熱）是附帶的，肌肉損傷更只是副作用。所以處方的核心永遠是：夠重、夠接近力竭、夠多組，再把每一塊肌肉都照顧到。') +
    `<div class="body">${pts([
      { k: '機械張力', s: 'MECHANICAL TENSION', p: '主因。肌纖維在收縮時被負荷拉著，張力越高、持續越久，訊號越強。接近力竭時慢縮肌帶不動了，快縮肌被徵召進來，這幾下最有價值。', hot: true },
      { k: '代謝壓力', s: 'METABOLIC STRESS', p: '高次數、短休息時的灼熱與泵感。有一點貢獻，但多半是因為它讓你更接近力竭。不用為了泵感犧牲重量。' },
      { k: '肌肉損傷', s: 'MUSCLE DAMAGE', p: '痠痛不是成長的尺。損傷太多反而佔掉恢復資源。新動作、大離心會讓你很痠，但痠不代表有效。' },
      { k: '伸展位置的張力', s: 'LENGTHENED POSITION', p: '近年證據一致：在肌肉拉長的位置承受張力（上斜彎舉、坐姿腿彎舉、過頭三頭伸展）長得比縮短位置多。選動作時優先挑拉長時最吃力的那個。' },
    ])}</div>` },
  { key: 'rir', title: '接近力竭與 RIR', cls: 'two', html: head('第 2 章 <em>肌肉怎麼長</em>', '最有效的是最後那幾下', '一組做到還剩 0 到 3 下做不起來（RIR 0–3），這一組才算數。留 5 下以上的組叫垃圾組數，看起來有練，訊號很弱。中階最常見的問題不是練太少，是太多組都留了太多。') +
    `<div class="body">${tbl(['#RIR', 'RPE', '感覺', '用在哪'], [
      ['0', '10', '再一下都不行，最後一下很慢、動作開始變形', '孤立動作的最後一組，一週幾次就好'],
      { hot: true, c: ['1–2', '8–9', '最後兩下明顯慢下來，還能維持動作', '肥大訓練的主力區間，大多數組停在這'] },
      ['3', '7', '開始有點吃力，速度還沒明顯掉', '複合動作、增量週的第一週、大重量的工作組'],
      ['4–5', '5–6', '輕鬆，像熱身', '熱身組、技術練習、減量週'],
    ])}<p class="quote"><b>怎麼估 RIR：</b>看槓速。當一下的向心速度比前一下明顯慢，你大概還剩 2 下；慢到快停住，剩 1。偶爾把孤立動作做到真的力竭，校正自己的估計，多數人高估剩餘次數 2 到 3 下。</p></div>` },
  { key: 'volume', title: '訓練量', cls: 'two', html: head('第 2 章 <em>肌肉怎麼長</em>', '每肌群每週 10 到 20 組', '一組＝接近力竭的一組。研究的劑量反應曲線大致是：10 組以下有效但不夠，10 到 20 組是甜蜜區，再往上多數人恢復不來。拉動下面的滑桿看每個區間代表什麼。') +
    `<div class="body"><div class="ctl"><label>每週組數 <input type="range" id="vol" min="0" max="30" value="12"><output id="volv">12</output></label><span class="v" id="volt"></span></div><div class="fig" id="f-volume"></div>${tbl(['地標', '#組數／週', '意思'], [
      ['維持量 MV', '4–6', '不會進步也不會退，減量週或旅行時用'],
      ['最低有效量 MEV', '6–10', '剛開始有成長訊號，一個訓練週期從這裡起步'],
      { hot: true, c: ['最佳量 MAV', '12–20', '成長最多、還恢復得了，週期中段待在這'] },
      ['最大可恢復量 MRV', '20–25+', '再加就恢復不來，表現開始掉，撞到就減量'],

MOUNT['volume'] = sec => {
  const W = 640, H = 200, g = S('svg', { viewBox: `0 0 ${W} ${H}` }), box = $('#f-volume', sec)
  const x = s => 40 + (s / 30) * (W - 60), y0 = H - 30, top = 30
  const f = s => { // 示意的劑量反應：上升後趨平，過 22 組開始下降
    const up = 1 - Math.exp(-s / 7.5); const down = s > 22 ? (s - 22) / 8 * 0.35 : 0; return Math.max(0, up - down) }
  const line = Array.from({ length: 61 }, (_, i) => { const s = i / 2; return `${x(s).toFixed(1)},${(y0 - f(s) * (y0 - top)).toFixed(1)}` }).join(' ')
  ;[[0, 6, '維持'], [6, 10, 'MEV'], [10, 20, 'MAV'], [20, 25, 'MRV'], [25, 30, '過量']].forEach(([a, b, t], i) => {
    g.append(S('rect', { x: x(a), y: top - 10, width: x(b) - x(a), height: y0 - top + 10, fill: i === 2 ? 'rgba(224,57,47,.12)' : i % 2 ? 'rgba(236,230,216,.04)' : 'transparent' }))
    g.append(S('text', { class: 'lb', x: (x(a) + x(b)) / 2, y: top - 14, 'text-anchor': 'middle' }, t))
  })
  g.append(S('line', { class: 'ax', x1: 40, y1: y0, x2: W - 20, y2: y0 }))
  ;[0, 5, 10, 15, 20, 25, 30].forEach(s => g.append(S('text', { class: 'lb n', x: x(s), y: y0 + 16, 'text-anchor': 'middle' }, s)))
  g.append(S('polyline', { class: 'ln', points: line }))
  const dot = S('circle', { class: 'dot', r: 7 }), lab = S('text', { class: 'lb2 n', 'text-anchor': 'middle' })
  g.append(dot, lab); box.append(g)
  const msg = s => s < 6 ? '維持量：不會退步，也幾乎不會進步。' : s < 10 ? '最低有效量：有訊號，一個週期從這裡起步。' : s <= 20 ? '最佳量：成長最多、還恢復得了。' : s <= 25 ? '逼近最大可恢復量：表現開始掉就該減量。' : '過量：恢復不來，多做的每一組都在扣分。'
  const upd = () => { const s = +$('#vol', sec).value; $('#volv', sec).textContent = s; $('#volt', sec).textContent = msg(s); dot.setAttribute('cx', x(s)); dot.setAttribute('cy', y0 - f(s) * (y0 - top)); lab.setAttribute('x', x(s)); lab.setAttribute('y', y0 - f(s) * (y0 - top) - 14); lab.textContent = `${s} 組` }
  $('#vol', sec).addEventListener('input', upd); upd()
}
MOUNT['frequency'] = sec => {
  const W = 640, H = 210, g = S('svg', { viewBox: `0 0 ${W} ${H}` })
  const y0 = H - 34, top = 24, bw = 14
  const draw = (x0, sets, label, dim) => {
    g.append(S('text', { class: 'lb2', x: x0, y: top - 6 }, label))
    sets.forEach((q, i) => { const h = q * (y0 - top); g.append(S('rect', { class: 'bar grow' + (dim && q < .6 ? ' dim' : '') + (!dim ? ' red' : ''), x: x0 + i * (bw + 4), y: y0 - h, width: bw, height: h, style: `--k:${i}` })) })
    g.append(S('line', { class: 'ax', x1: x0 - 6, y1: y0, x2: x0 + sets.length * (bw + 4), y2: y0 }))
    g.append(S('text', { class: 'lb', x: x0, y: y0 + 16 }, `${sets.length} 組 · 組的品質（張力）`))
  }
  draw(40, [1, .98, .95, .92, .88, .84, .78, .72, .64, .56, .5, .44, .4, .36, .33, .3], '同一天做 16 組', true)
  draw(360, [1, .98, .95, .92, .88, .84, .78, .72], '週一 8 組', false)
  draw(520, [1, .98, .95, .92, .88, .84, .78, .72], '週四 8 組', false)
  $('#f-freq', sec).append(g)
}
MOUNT['overload'] = sec => {
  const W = 640, H = 220, box = $('#f-overload', sec), log = $('#ov-log', sec)
  let week = 0, w = 24, reps = [8, 8, 8], hist = []
  const step = () => { // 雙重進階：三組都到 12 就加重、回 8；不然每週每組 +1（第三組稍慢）
    if (reps.every(r => r >= 12)) { w += 2; reps = [8, 8, 8] } else reps = reps.map((r, i) => Math.min(12, r + (i === 2 && week % 2 ? 0 : 1)))
    week++; hist.push({ week, w, reps: [...reps] })
  }
  const render = () => {
    box.textContent = ''; const g = S('svg', { viewBox: `0 0 ${W} ${H}` })
    const n = 12, x = i => 40 + (i / n) * (W - 60), y0 = H - 30, top = 26
    g.append(S('line', { class: 'ax', x1: 40, y1: y0, x2: W - 20, y2: y0 }))
    for (let i = 1; i <= n; i++) g.append(S('text', { class: 'lb n', x: x(i), y: y0 + 16, 'text-anchor': 'middle' }, i))
    g.append(S('text', { class: 'lb', x: 40, y: y0 + 16 }, '週'))
    const vol = h => h.w * h.reps.reduce((a, b) => a + b, 0)
    const vmax = Math.max(...hist.map(vol), 1200)
    hist.forEach((h, i) => { const hh = (vol(h) / vmax) * (y0 - top); g.append(S('rect', { class: 'bar' + (i === hist.length - 1 ? ' red' : ''), x: x(h.week) - 11, y: y0 - hh, width: 22, height: hh })); g.append(S('text', { class: 'lb n', x: x(h.week), y: y0 - hh - 6, 'text-anchor': 'middle' }, `${h.w}`)) })
    g.append(S('text', { class: 'lb', x: W - 20, y: top - 8, 'text-anchor': 'end' }, '柱高＝總訓練量（重量 × 總次數）；數字＝啞鈴公斤'))
    box.append(g)
    $('#ov-week', sec).textContent = week ? `第 ${week} 週` : '第 0 週：24 kg × 8 / 8 / 8'
    log.innerHTML = hist.length ? `<div class="tw">${tbl(['#週', '#啞鈴', '#三組次數', '規則'], hist.slice(-4).map(h => [h.week, `${h.w} kg`, h.reps.join(' / '), h.reps.every(r => r === 8) && h.week > 1 ? '三組都到 12，加 2 公斤、次數回 8' : h.reps.every(r => r >= 12) ? '全部到上限，下週加重' : '還在區間內，加次數']), 'dense')}</div>` : ''
    $('#ov-next', sec).disabled = week >= 12
  }
  $('#ov-next', sec).addEventListener('click', () => { step(); render() })
  $('#ov-reset', sec).addEventListener('click', () => { week = 0; w = 24; reps = [8, 8, 8]; hist = []; render() })
  render()
}

MOUNT['calories'] = sec => {
  let act = 33
  const upd = () => { const w = +$('#nu-w', sec).value || 0, t = w * act; $('#nu-tdee', sec).innerHTML = `${Math.round(t)}<small>kcal</small>`; $('#nu-bulk', sec).innerHTML = `${Math.round(t + 350)}<small>kcal</small>`; $('#nu-cut', sec).innerHTML = `${Math.round(t - 400)}<small>kcal</small>`; const pr = $('#pr-day'); if (pr) { pr.innerHTML = `${Math.round(w * 1.6)}–${Math.round(w * 2.2)}<small>g</small>`; $('#pr-meal').innerHTML = `${Math.round(w * .4)}<small>g</small>`; $('#pr-cut').innerHTML = `${Math.round(w * 2)}–${Math.round(w * 2.4)}<small>g</small>` } }
  $('#nu-w', sec).addEventListener('input', upd)
  $('#nu-act', sec).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; act = +b.dataset.a; $$('button', $('#nu-act', sec)).forEach(x => x.setAttribute('aria-pressed', String(x === b))); upd() })
  upd()
}

DECK.push({ n: 7, title: '營養品', en: 'SUPPLEMENTS', sub: '三級：有證據、看情況、不值得', slides: [
  { key: 'supp', title: '三級清單', cls: 'wide', html: head('第 7 章 <em>營養品</em>', '營養品只有三級', '飲食與睡眠做到位之後，營養品能加的大概是 5%。第一級有一致的證據、便宜、安全；第二級在特定情況有用；第三級是行銷。劑量都是研究用的量，產品標示比這高不代表更有效。') +
    `<div class="body"><div class="tier hot1"><div><h3>第一級<b>有證據，值得</b></h3><ul>
      <li><b>肌酸一水合物</b><small>每天 3–5 g，任何時間，不用裝填期</small>力量與重複次數多 5 到 10%，間接長更多肌肉。最便宜、研究最多的一個。</li>
      <li><b>咖啡因</b><small>每公斤 3–6 mg，訓練前 30–60 分</small>力量、耐力、專注都有效。半衰期 5 到 6 小時，睡前 8 小時內不要碰。</li>
      <li><b>乳清／酪蛋白</b><small>一匙 20–40 g 蛋白質</small>就是方便的蛋白質，食物吃得夠就不需要。酪蛋白適合睡前。</li>
      <li><b>維生素 D</b><small>每天 1000–2000 IU，缺的人</small>曬不到太陽的上班族多半偏低；抽血確認最好。對肌肉的直接效果小，對免疫與骨頭有用。</li>
      <li><b>魚油</b><small>每天 1–2 g EPA+DHA</small>一週吃不到兩次魚才需要。對肥大的證據弱，對整體健康與關節有一點。</li>
    </ul></div><div><h3>第二級<b>看情況</b></h3><ul>
      <li><b>β-丙胺酸</b><small>每天 3.2–6.4 g，分次</small>對 1 到 4 分鐘的高強度有幫助，對純力量幾乎沒有。皮膚刺麻是正常的。</li>
      <li><b>瓜胺酸蘋果酸</b><small>6–8 g，訓練前 60 分</small>多做一兩下、泵感好一點，效果小但真的有。</li>
      <li><b>硝酸鹽（甜菜根）</b><small>訓練前 2–3 小時</small>對耐力有效，對重訓證據薄。</li>
      <li><b>電解質</b><small>大量流汗時</small>一堂 60 分鐘的重訓不需要，夏天戶外或兩小時以上才需要。</li>
      <li><b>鎂、鋅</b><small>缺的人</small>缺乏時補回來有用，不缺多吃沒有額外效果。</li>
    </ul></div><div><h3>第三級<b>不值得</b></h3><ul>
      <li><b>BCAA</b><small>蛋白質吃夠就是多餘</small>乳清裡已經有，單獨補對合成沒有額外效果。</li>

  const c = chOf[cur]
  plates.forEach(p => { p.r.classList.toggle('on', p.ch === c); p.r.classList.toggle('done', p.ch < c || keys[cur] === 'end'); p.t.classList.toggle('on', p.ch === c) })
  rodon.setAttribute('stroke-dashoffset', String(1 - cur / (N - 1)))
  const ch = DECK.find(x => x.n === c)
  $('#cur').innerHTML = ch ? `<b>第 ${ch.n} 章 ${esc(ch.title)}</b>${esc(ch.en)} · ${esc(titles[cur])}` : `<b>${esc(titles[cur])}</b>${flat.length + 1} 張`
}

/* ═══ 投影片控制 ═══ */
let cur = Math.max(0, keys.indexOf(location.hash.slice(1))), auto = false, autoT = 0
const pg = $('#pg')
slides.forEach((s, i) => { const b = document.createElement('button'); b.type = 'button'; if (i === 0 || chOf[i] !== chOf[i - 1]) b.classList.add('ch'); b.setAttribute('aria-label', `第 ${i + 1} 張：${titles[i]}`); b.title = titles[i]; b.innerHTML = '<i></i>'; b.addEventListener('click', () => go(i)); pg.append(b) })
const dots = $$('button', pg)
function sync() {
  slides.forEach((s, i) => { const on = i === cur; s.classList.toggle('is-on', on); s.inert = !on; s.setAttribute('aria-hidden', String(!on)) })
  dots.forEach((d, i) => d.setAttribute('aria-current', String(i === cur)))
  $('#count').textContent = `${cur + 1} / ${N}`; $('#prev').disabled = cur === 0; $('#next').disabled = cur === N - 1
  $('#live').textContent = `第 ${cur + 1} 張，${titles[cur]}`
  paintBar()
  history.replaceState(null, '', '#' + keys[cur])
}
function go(to, { instant = false } = {}) { to = clamp(to, 0, N - 1); if (to === cur && !instant) return; cur = to; sync(); if (auto) armAuto() }
const goKey = k => { const i = keys.indexOf(k); if (i >= 0) go(i) }
const next = () => go(cur + 1), prev = () => go(cur - 1)
function armAuto() { clearTimeout(autoT); autoT = setTimeout(() => { if (cur < N - 1) go(cur + 1); else setAuto(false) }, 15000) }
function setAuto(on) { auto = on; $('#auto').setAttribute('aria-pressed', String(on)); $('#auto').setAttribute('aria-label', on ? '停止自動放映' : '自動放映'); on ? (cur === N - 1 ? go(0) : armAuto()) : clearTimeout(autoT) }
$('#auto').addEventListener('click', () => setAuto(!auto))
document.addEventListener('visibilitychange', () => { if (document.hidden) clearTimeout(autoT); else if (auto) armAuto() })
const fsBtn = $('#fs'); if (!document.fullscreenEnabled) fsBtn.hidden = true
const toggleFs = () => { if (!document.fullscreenEnabled) return; document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen().catch(() => {}) }
fsBtn.addEventListener('click', toggleFs)
document.addEventListener('fullscreenchange', () => fsBtn.setAttribute('aria-pressed', String(!!document.fullscreenElement)))
$('#next').addEventListener('click', next); $('#prev').addEventListener('click', prev)
$$('[data-go]').forEach(b => b.addEventListener('click', () => go(+b.dataset.go)))
$$('.toc button').forEach(b => b.addEventListener('click', () => goKey(b.dataset.key)))
addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return
  const onCtl = e.target.closest && e.target.closest('a,button,input,textarea,select,summary')
  if (e.target.closest && e.target.closest('input')) return   // 計算機裡打字不換頁
  switch (e.key) {
    case 'ArrowRight': case 'ArrowDown': case 'PageDown': next(); break
    case 'ArrowLeft': case 'ArrowUp': case 'PageUp': prev(); break
    case ' ': if (onCtl) return; e.shiftKey ? prev() : next(); break
    case 'Home': go(0); break
    case 'End': go(N - 1); break
    case 'f': case 'F': toggleFs(); break
    case 'p': case 'P': setAuto(!auto); break
    default: if (/^[0-9]$/.test(e.key)) { const n = e.key === '0' ? 10 : +e.key; const ch = DECK.find(c => c.n === n); if (ch) goKey(ch.slides[0].key) } else return
  }
  e.preventDefault()
})
const deck = $('#deck')
let sx = 0, sy = 0, st = 0, sid = null, swiped = false
deck.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' || e.target.closest('input')) return; const tw = e.target.closest('.tw'); if (tw && tw.scrollWidth > tw.clientWidth + 2) return; sx = e.clientX; sy = e.clientY; st = performance.now(); sid = e.pointerId; swiped = false })
deck.addEventListener('pointerup', e => { if (e.pointerId !== sid) return; sid = null; const dx = e.clientX - sx, dy = e.clientY - sy; if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4 && performance.now() - st < 800) { swiped = true; dx < 0 ? next() : prev() } })
deck.addEventListener('click', e => { if (swiped) { e.preventDefault(); e.stopPropagation(); swiped = false } }, true)
let wLock = false, wAt = 0, wLast = 0
deck.addEventListener('wheel', e => {
  if (e.ctrlKey) return
  if (e.target.closest && e.target.closest('.tw') && Math.abs(e.deltaX) > Math.abs(e.deltaY)) return   // 表格橫向捲動
  const sl = slides[cur]; if (sl.scrollHeight > sl.clientHeight + 24) { const top = sl.scrollTop <= 0, bot = sl.scrollTop + sl.clientHeight >= sl.scrollHeight - 1; if (!(e.deltaY > 0 ? bot : top)) return }
  const now = performance.now(), gap = now - wLast; wLast = now
  if (wLock) { if (now - wAt > 900 && gap > 140) wLock = false; else return }
  const dd = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX
  if (Math.abs(dd) < 24) return
  wLock = true; wAt = now; dd > 0 ? next() : prev()
}, { passive: true })
addEventListener('hashchange', () => { const i = keys.indexOf(location.hash.slice(1)); if (i >= 0 && i !== cur) go(i) })

ready = true
go(cur, { instant: true })
root.dataset.ready = '1'
window.__lift = { DECK, PROGRAMS, MUSCLES, go, goKey, keys }
})()
</script>
