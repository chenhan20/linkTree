  <!-- 顱骨 -->
  <path fill="#f8f4ea" d="M32 15.5c-9.4 0-16 6.6-16 15.2 0 4.6 1.9 8.3 4.9 10.9V47c0 1.9 1.4 3.4 3.3 3.4h15.6c1.9 0 3.3-1.5 3.3-3.4v-5.4c3-2.6 4.9-6.3 4.9-10.9 0-8.6-6.6-15.2-16-15.2z"/>
